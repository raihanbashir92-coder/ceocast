name: Update latest episode

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-latest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Check for a new video
        id: update
        run: echo "result=$(python scripts/update_latest.py)" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.update.outputs.result == 'changed'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json thumb.jpg
          git commit -m "Update latest episode to $(python -c 'import json;print(json.load(open("latest.json"))["id"])')"
          git push
